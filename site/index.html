<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>APROAR - Gestão de Equipes · Visual EPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#0a1830;
  --navy-2:#102442;
  --blue:#2563eb;
  --blue-2:#1d4ed8;
  --blue-soft:#eff6ff;
  --sky:#f3f8ff;
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#10213d;
  --muted:#6b7c93;
  --muted-2:#8a9ab0;
  --border:#dce5f0;
  --border-2:#e8eef6;
  --green:#10b981;
  --orange:#f59e0b;
  --red:#f43f5e;
  --purple:#7c3aed;
  --shadow:0 18px 40px rgba(15, 23, 42, .06);
  --shadow-soft:0 10px 22px rgba(15, 23, 42, .05);
}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(180deg,#f7faff 0%, #f4f7fb 100%);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}
.app{min-height:100vh}

/* ---------- shared ---------- */
.brand-logo{display:flex;align-items:center;gap:12px}
.brand-badge{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,#0e223f,#183a66);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;box-shadow:var(--shadow-soft)}
.brand-badge.small{width:38px;height:38px;border-radius:12px;font-size:14px}
.brand-copy b{display:block;font-size:16px;letter-spacing:.02em}
.brand-copy span{display:block;font-size:12px;color:var(--muted-2);margin-top:3px}
.brand-logo img.logo-img{display:block;max-width:170px;width:100%;border-radius:8px;background:#fff;padding:6px;box-shadow:var(--shadow-soft)}
.topline{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#7890ae;font-weight:800}
.page-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin:0 0 18px}
.kicker{font-size:10px;font-weight:800;letter-spacing:1.15px;color:#7890AE;text-transform:uppercase;margin-bottom:5px}
.page-title{font-size:32px;line-height:1.02;font-weight:770;letter-spacing:-.03em;color:var(--text)}
.page-sub{margin-top:6px;color:#7B8CA4;font-size:14px;max-width:780px}
.page-side{font-size:12px;color:#7C8DA5;text-align:right;line-height:1.5}
.section{margin:22px 0 10px}.section-title{font-size:18px;font-weight:730;color:#10213D}.section-sub{font-size:12px;color:#8090A7;margin-top:3px}
.caption{color:var(--muted);font-size:12px;line-height:1.5;margin:6px 0 10px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow-soft)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.fields{display:grid;gap:12px}.field label{display:block;font-size:11px;font-weight:700;color:#40536D;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em}.control{width:100%;min-height:44px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--text);padding:0 13px;box-shadow:0 1px 0 rgba(255,255,255,.8) inset}.control.multiline{min-height:84px;padding-top:12px}.control:focus{outline:none;border-color:#bfd7ff;box-shadow:0 0 0 4px rgba(37,99,235,.08)}
select.control[multiple]{padding:8px 10px;min-height:118px}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--border);background:#fff;color:#24466F;font-weight:700;padding:0 15px;cursor:pointer;box-shadow:var(--shadow-soft);transition:.18s ease}.btn:hover{background:#F7FAFE;border-color:#B8C8DD;transform:translateY(-1px)}.btn.primary{background:linear-gradient(180deg,var(--blue),var(--blue-2));border-color:var(--blue);color:#fff}.btn.primary:hover{background:linear-gradient(180deg,var(--blue-2),#1b46c2);border-color:var(--blue-2)}.btn.ghost{background:transparent;border-color:#cad7e6;box-shadow:none}.btn.full{width:100%}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin:4px 0 18px;overflow:auto;padding-bottom:2px}.tab{border:0;background:transparent;color:#475569;padding:12px 13px;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap;cursor:pointer}.tab.active{color:var(--blue);font-weight:750;border-bottom-color:var(--blue)}
.metric-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:16px 0}.metric{background:linear-gradient(180deg,#fff 0%,#fbfdff 100%);border:1px solid var(--border);border-radius:18px;min-height:110px;padding:16px;box-shadow:var(--shadow-soft)}.metric-label{font-size:10px;color:#53677F;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.metric-value{font-size:30px;line-height:1;font-weight:780;margin:10px 0 7px;color:#091A33;letter-spacing:-.03em}.metric-note{font-size:11px;color:#7D8EA5;line-height:1.35}.metric.warn .metric-value{color:#B66C18}.metric.danger .metric-value{color:#C44557}.metric.ok .metric-value{color:#14805D}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#EEF5FF;color:#2563EB;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.home-title{font-size:33px;font-weight:780;letter-spacing:-.03em}.home-sub{font-size:14px;color:#7B8CA4;margin-top:5px;max-width:750px}.home-date{text-align:right;color:#24466F;font-size:13px}.home-date span{display:block;color:#7C8DA5;font-size:11px;margin-top:4px}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.action-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow-soft)}.action-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.action-title{font-size:18px;font-weight:760}.action-sub{font-size:12px;color:#8090A7;margin-top:2px}.pill{border-radius:999px;padding:7px 11px;font-size:10px;font-weight:800;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}.pill.amber{background:#FFF2D8;color:#C96D00}.pill.red{background:#FFE9EE;color:#D72B4C}.task{display:flex;justify-content:space-between;gap:12px;padding:13px 14px;border-radius:14px;border:1px solid #E6EBF2;background:#fff;margin-top:10px;box-shadow:0 8px 18px rgba(15,23,42,.03)}.task strong{display:block;font-size:13px}.task span{display:block;color:#71849D;font-size:11px;margin-top:4px;line-height:1.45}.task-count{font-size:12px;font-weight:760;align-self:center}.task.amber{border-left:4px solid var(--orange)}.task.red{border-left:4px solid var(--red)}.task.green{border-left:4px solid var(--green)}.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:8px}.quick .btn{width:100%}
.alert{border-radius:14px;padding:13px 14px;font-size:12px;line-height:1.5;margin:8px 0}.alert.info{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E3A8A}.alert.warn{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412}.alert.success{background:#ECFDF5;border:1px solid #A7F3D0;color:#065F46}.alert.danger{background:#FFF1F2;border:1px solid #FECDD3;color:#9F1239}
.table-wrap{border:1px solid var(--border);border-radius:16px;overflow:auto;background:#fff;box-shadow:var(--shadow-soft)}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{background:#F8FAFC;color:#40536D;text-align:left;padding:12px 12px;border-bottom:1px solid var(--border);font-weight:800;white-space:nowrap;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em}.table td{padding:12px;border-bottom:1px solid #EEF2F7;white-space:nowrap;color:#24364F}.table tr:last-child td{border-bottom:0}
.barbox{height:190px;border:1px solid var(--border);border-radius:16px;background:linear-gradient(to top,#f5f8fd 0,#f5f8fd 24%,#fff 24%,#fff 25%,#f5f8fd 25%,#f5f8fd 49%,#fff 49%,#fff 50%,#f5f8fd 50%,#f5f8fd 74%,#fff 74%,#fff 75%,#f5f8fd 75%);display:flex;align-items:flex-end;gap:18px;padding:18px 20px;margin-top:10px}.bar{flex:1;background:linear-gradient(180deg,#5da0ff,#2563eb);border-radius:7px 7px 0 0;min-width:24px;opacity:.88;box-shadow:0 10px 22px rgba(37,99,235,.18)}.bar:nth-child(2){height:75%!important}.bar:nth-child(3){height:48%!important}.bar:nth-child(4){height:64%!important}
.expander{border:1px solid var(--border);border-radius:16px;background:#fff;margin:8px 0;overflow:hidden;box-shadow:var(--shadow-soft)}.expander summary{padding:13px 15px;font-size:12px;font-weight:750;cursor:pointer;list-style:none;position:relative}.expander summary::-webkit-details-marker{display:none}.expander summary:after{content:'▾';position:absolute;right:16px;top:13px;color:#7f90a6;transition:.2s}.expander[open] summary:after{transform:rotate(180deg)}.expander-body{padding:0 15px 15px}
.split{display:grid;grid-template-columns:1fr 1.7fr;gap:12px}.subsplit{display:grid;grid-template-columns:1.7fr 1fr;gap:12px}.person{border:1px solid var(--border);border-radius:18px;background:#fff;padding:18px;margin:10px 0;box-shadow:var(--shadow-soft)}.person h3{margin:0 0 4px;font-size:18px}.person .meta{font-size:11px;color:#7A8CA4;margin-bottom:12px;line-height:1.45}.form-actions{margin-top:12px}.status-chip{font-size:10px;padding:5px 9px;border-radius:999px;background:#EFF6FF;color:#1D4ED8;font-weight:800;letter-spacing:.05em;text-transform:uppercase}.conflict{border:1px solid var(--border);border-radius:18px;background:#fff;padding:18px;margin:10px 0;box-shadow:var(--shadow-soft)}.conflict h3{margin:0 0 8px;font-size:18px}
.codeblock{white-space:pre-wrap;background:#0F172A;color:#E2E8F0;border-radius:16px;padding:15px 16px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;box-shadow:var(--shadow-soft)}
.checkrow{display:flex;align-items:center;gap:8px;font-size:12px;color:#40536D}.mini-note{font-size:11px;color:#7A8CA4}.right{display:flex;justify-content:flex-end;gap:8px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb0{margin-bottom:0}.w100{width:100%}

/* ---------- landing / profile ---------- */
.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px;background:radial-gradient(circle at top left, rgba(37,99,235,.10), transparent 28%), radial-gradient(circle at bottom right, rgba(124,58,237,.08), transparent 32%), linear-gradient(180deg,#f8fbff 0%,#f3f6fb 100%)}
.auth-wrap{width:min(1180px,100%);display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:stretch}
.hero-card,.login-card{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid rgba(220,229,240,.9);border-radius:28px;box-shadow:0 24px 60px rgba(15,23,42,.08)}
.hero-card{padding:34px;position:relative;overflow:hidden}
.hero-card:before{content:'';position:absolute;right:-110px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle, rgba(37,99,235,.16), transparent 62%)}
.hero-card:after{content:'';position:absolute;left:-110px;bottom:-130px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle, rgba(124,58,237,.10), transparent 60%)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#eef5ff;color:#245fd6;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.hero-title{font-size:44px;line-height:.98;font-weight:800;letter-spacing:-.05em;margin:18px 0 10px;max-width:640px;position:relative;z-index:1}
.hero-sub{max-width:620px;font-size:15px;line-height:1.6;color:#60738f;position:relative;z-index:1}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px;position:relative;z-index:1}
.hero-stat{background:linear-gradient(180deg,#fff,#f8fbff);border:1px solid var(--border-2);border-radius:18px;padding:16px;box-shadow:var(--shadow-soft)}
.hero-stat b{display:block;font-size:27px;letter-spacing:-.03em}
.hero-stat span{display:block;margin-top:5px;font-size:12px;color:#6f8097;line-height:1.45}
.hero-note{margin-top:18px;padding:14px 16px;border-radius:16px;border:1px solid #dbeafe;background:#f5faff;color:#315681;font-size:12px;line-height:1.55;position:relative;z-index:1}
.login-card{padding:28px 24px}
.login-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.login-title{font-size:28px;font-weight:780;letter-spacing:-.03em}
.login-sub{font-size:13px;line-height:1.55;color:#708198;margin-top:5px}
.profile-grid{display:grid;gap:12px;margin-top:18px}
.profile-card{border:1px solid var(--border);border-radius:18px;background:#fff;padding:16px;box-shadow:var(--shadow-soft);cursor:pointer;transition:.18s ease}
.profile-card:hover{transform:translateY(-2px);border-color:#bfd7ff;box-shadow:0 18px 36px rgba(37,99,235,.09)}
.profile-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.profile-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#eef5ff;color:#245fd6;box-shadow:inset 0 0 0 1px #dbeafe}
.profile-title{font-size:16px;font-weight:760}
.profile-sub{font-size:12px;color:#6f8097;line-height:1.5;margin-top:4px}
.profile-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.profile-tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-radius:999px;background:#f8fafc;color:#52657c;border:1px solid var(--border-2)}
.login-foot{margin-top:16px;padding-top:14px;border-top:1px dashed #d7e2ee;font-size:11px;color:#8293aa;line-height:1.55}

/* ---------- admin shell ---------- */
.admin-shell{display:flex;min-height:100vh}
.sidebar{width:286px;min-width:286px;background:linear-gradient(180deg,var(--navy) 0%, #0d2241 100%);border-right:1px solid #17304f;padding:18px 16px 18px;position:fixed;left:0;top:0;bottom:0;overflow:auto}
.side-brand{padding:10px 10px 16px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:14px}
.side-brand .logo-fallback{display:flex;align-items:center;gap:10px;color:#fff;font-size:17px;font-weight:800;letter-spacing:.05em}
.side-brand .sidebar-sub{text-align:left;color:#9FB0C7;font-size:11px;letter-spacing:.9px;margin:8px 0 0;font-weight:600}
.side-user{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 12px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);margin-bottom:14px}
.side-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#2158c8,#0f2f74);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.side-user-name{font-size:13px;color:#fff;font-weight:760}
.side-user-role{font-size:11px;color:#9fb0c7;margin-top:3px}
.side-section{color:#7890AE;font-size:9px;letter-spacing:1.25px;font-weight:800;margin:18px 8px 8px;text-transform:uppercase}
.navbtn{width:100%;min-height:42px;text-align:left;padding:0 12px;margin:2px 0;border-radius:12px;border:1px solid transparent;background:transparent;color:#D7E1EE;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.18s ease}.navbtn:hover{background:#142A49;border-color:#203A5C;color:white}.navbtn.active{background:linear-gradient(180deg,#2563eb,#1d4ed8);border-color:#2563eb;color:#fff;font-weight:700;box-shadow:0 12px 26px rgba(37,99,235,.22)}
.navicon{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);font-size:14px;flex:0 0 auto;color:currentColor}
.navicon svg{width:16px;height:16px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.navlabel{display:inline-flex;align-items:center;line-height:1.2}
.navbtn.active .navicon{background:rgba(255,255,255,.16)}
.side-spacer{height:18px}.side-caption{color:#8FA3BD;font-size:11px;margin:0 4px 8px;line-height:1.5}.side-lock{width:100%;min-height:41px;border-radius:12px;border:1px solid #28415F;background:transparent;color:#D7E1EE;cursor:pointer;font-weight:700}.side-lock:hover{background:#132844}
.main{margin-left:286px;min-width:0;width:calc(100% - 286px);padding:1.35rem 1.6rem 2rem}
.main-inner{max-width:1500px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}
.topbar-card{display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);border:1px solid rgba(220,229,240,.8);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow-soft)}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}.topbar-icon{width:42px;height:42px;border-radius:14px;background:#eef5ff;color:#245fd6;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}.topbar-title b{display:block;font-size:14px}.topbar-title span{display:block;margin-top:3px;font-size:12px;color:#74859c}.topbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border-radius:999px;background:#f8fbff;border:1px solid var(--border);font-size:11px;font-weight:800;color:#56708f;letter-spacing:.04em;text-transform:uppercase}

/* ---------- viewer ---------- */
.viewer{max-width:1240px;margin:0 auto;padding:2rem}.viewer h2{margin:0;font-size:30px;letter-spacing:-.03em}.viewer-nav{display:flex;gap:6px;margin-top:18px;border-bottom:1px solid var(--border)}
.viewer-shell{background:rgba(255,255,255,.76);backdrop-filter:blur(8px);border:1px solid rgba(220,229,240,.9);border-radius:24px;padding:22px;box-shadow:var(--shadow)}

/* ---------- engineer portal ---------- */
.field-shell{max-width:820px;margin:0 auto;padding:1rem .86rem 5.8rem;min-height:100vh}
.field-homebar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 12px 14px;margin-bottom:10px;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);border:1px solid rgba(220,229,240,.85);border-radius:20px;box-shadow:var(--shadow-soft)}
.field-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 10px;padding:18px;border-radius:22px;background:linear-gradient(180deg,#102442 0%,#16345d 100%);color:#fff;box-shadow:0 20px 38px rgba(16,36,66,.18)}
.field-kicker{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#b7c8e1;font-weight:800}.field-title{font-size:27px;line-height:1.05;font-weight:780;margin-top:4px;letter-spacing:-.03em}.field-sub{font-size:12px;line-height:1.5;color:#d1dced;margin-top:7px;max-width:420px}.field-date{font-size:10px;line-height:1.35;color:#d1dced;text-align:right}.field-date b{font-size:13px;color:#fff}.field-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.field-tab{border:1px solid var(--border);background:#fff;border-radius:14px;min-height:44px;color:#52657C;font-weight:700;cursor:pointer;box-shadow:var(--shadow-soft)}.field-tab.active{background:#EEF5FF;color:#2563EB;border-color:#BFDBFE}

function metric(label,value,note='',cls=''){return `<div class="metric ${cls}"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-note">${note}</div></div>`}

function currentMode(){return (location.hash||'#login').replace('#','').toLowerCase()}
function getAuth(){try{return JSON.parse(sessionStorage.getItem(AUTH_KEY)||'{}')}catch(e){return {}}}
function saveAuth(v){sessionStorage.setItem(AUTH_KEY,JSON.stringify(v))}
function hasAccess(key){if(key==='visualizacao') return true; const auth=getAuth(); return !!(auth[key]&&auth[key].token)}
async function setProfile(key){
  if(key==='visualizacao'){
    currentProfile=key; location.hash=profileMeta[key].route; render(); return;
  }
  const label=key==='suprimentos' ? 'Controladoria e Resultados' : key==='financeiro' ? 'Financeiro' : 'Portal do Supervisor';
  const pwd=window.prompt('Digite a senha de acesso para '+label+':','');
  if(pwd===null) return;
  try{
    const res=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:key,password:pwd})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok||!data.token){ alert(data.error||'Senha incorreta.'); return; }
    const auth=getAuth(); auth[key]={token:data.token,expiresAt:data.expiresAt}; saveAuth(auth);
    currentProfile=key; location.hash=profileMeta[key].route; render();
  }catch(e){
    alert('Não foi possível validar o acesso agora. Tente novamente.');
  }
}
function goLogin(){location.hash='login'; render()}
function logout(){sessionStorage.removeItem(AUTH_KEY); goLogin()}

    if(!hasAccess('engenheiro')){ goLogin(); return; }
    currentProfile='engenheiro'; renderField(); return;
  }
  if(h==='financeiro'||h==='fin'){
    if(!hasAccess('financeiro')){ goLogin(); return; }
    currentProfile='financeiro'; renderFinance(); return;
  }
  if(h==='view'||h==='visualizador'){ currentProfile='visualizacao'; renderViewer(); return; }
  if(!hasAccess('suprimentos')){ goLogin(); return; }
  currentProfile='suprimentos'; renderAdmin();
}
